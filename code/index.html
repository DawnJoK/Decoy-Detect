<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Search UI</title>
    <!-- Tailwind CSS CDN for modern and responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to ensure the Inter font is used and for general body styling */
        body {
            font-family: "Inter", sans-serif;
            background-color: #f0f2f5; /* Light gray background */
            display: flex; /* Use flexbox for centering content */
            flex-direction: column; /* Arrange items vertically */
            justify-content: flex-start; /* Align items to the start of the cross axis */
            align-items: center; /* Center horizontally */
            min-height: 100vh; /* Full viewport height */
            margin: 0; /* Remove default body margin */
            padding: 0; /* Remove default body padding */
            box-sizing: border-box; /* Include padding in element's total width and height */
        }

        /* Adjusting the search container for proper spacing with the nav bar */
        .search-container {
            margin-top: 2rem; /* Add margin to separate from nav bar */
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="w-full bg-blue-700 p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="#" class="text-white text-2xl font-bold rounded-lg px-3 py-1 hover:bg-blue-600 transition duration-300">Decoy Detect</a>
            <!-- You can add more nav items here if needed -->
        </div>
    </nav>

    <!-- Main container for the search interface -->
    <div class="search-container bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <!-- Title for the search box -->
        <h1 class="text-2xl font-semibold text-gray-800 mb-6">Paste a URL to search</h1>

        <!-- Input group for the URL input and search button -->
        <div class="input-group flex flex-col sm:flex-row gap-4 mb-6">
            <!-- URL input field -->
            <input
                type="url"
                id="urlInput"
                class="url-input flex-grow p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition duration-300 ease-in-out"
                placeholder="e.g., https://www.example.com"
            >
            <!-- Search button -->
            <button
                id="searchButton"
                class="search-button bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-300 ease-in-out transform hover:scale-105"
            >
                Search
            </button>
        </div>

        <!-- Results container, initially hidden -->
        <div id="resultsBox" class="hidden bg-gray-50 p-6 rounded-lg border border-gray-200 text-left mt-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Analysis Results</h2>
            <div class="mb-4">
                <p class="text-lg font-medium text-gray-800">Trust Score: <span id="trustScore" class="text-blue-600 font-bold">--</span>/100</p>
            </div>
            <div>
                <p class="text-lg font-medium text-gray-800 mb-2">Comments:</p>
                <textarea
                    id="commentSection"
                    class="w-full p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition duration-300 ease-in-out resize-y"
                    rows="5"
                    readonly
                ></textarea>
            </div>
        </div>
    </div>

    <script>
        // Get references to HTML elements
        const urlInput = document.getElementById('urlInput');
        const searchButton = document.getElementById('searchButton');
        const resultsBox = document.getElementById('resultsBox');
        const trustScoreDisplay = document.getElementById('trustScore');
        const commentSection = document.getElementById('commentSection');

        // Add event listener to the search button
        searchButton.addEventListener('click', () => {
            const url = urlInput.value.trim(); // Get the URL and remove leading/trailing whitespace

            // Basic validation: Check if the URL input is not empty
            if (url === '') {
                // Clear previous classes and set default background
                resultsBox.classList.remove('bg-red-100', 'bg-yellow-100', 'bg-green-100');
                resultsBox.classList.add('bg-gray-50'); // Default background
                commentSection.value = 'Please enter a URL to analyze.';
                trustScoreDisplay.textContent = '--';
                resultsBox.classList.remove('hidden'); // Show the box even for errors
                return; // Stop execution if URL is empty
            }

            // Simulate an API call for analysis
            // In a real application, you would send 'url' to a backend API
            // and receive actual trust score and comments.
            // For this example, we'll use dummy data.

            // Simulate a random trust score between 50 and 100
            const simulatedTrustScore = Math.floor(Math.random() * 51) + 50; // Generates a number from 50 to 100

            // Simulate comments based on the score
            let simulatedComment;
            if (simulatedTrustScore >= 80) {
                simulatedComment = `This URL (${url}) appears to be highly trustworthy based on our analysis.`;
            } else if (simulatedTrustScore >= 60) {
                simulatedComment = `This URL (${url}) seems moderately trustworthy. Exercise caution and verify the source.`;
            } else {
                simulatedComment = `Caution: This URL (${url}) has a low trust score. It might be a decoy or phishing attempt. Proceed with extreme care.`;
            }

            // Update the results box with the simulated data
            trustScoreDisplay.textContent = simulatedTrustScore;
            commentSection.value = simulatedComment;

            // Make the results box visible
            resultsBox.classList.remove('hidden');

            // --- New logic for changing background color based on trust score ---
            // First, remove any existing background color classes to ensure only one is applied
            resultsBox.classList.remove('bg-red-100', 'bg-yellow-100', 'bg-green-100', 'bg-gray-50');

            if (simulatedTrustScore < 70) {
                resultsBox.classList.add('bg-red-100'); // Light red for low trust
                trustScoreDisplay.classList.remove('text-blue-600', 'text-yellow-600', 'text-green-600');
                trustScoreDisplay.classList.add('text-red-600'); // Red text for score
            } else if (simulatedTrustScore >= 70 && simulatedTrustScore <= 90) {
                resultsBox.classList.add('bg-yellow-100'); // Light yellow for moderate trust
                trustScoreDisplay.classList.remove('text-blue-600', 'text-red-600', 'text-green-600');
                trustScoreDisplay.classList.add('text-yellow-600'); // Yellow text for score
            } else { // trustScore > 90
                resultsBox.classList.add('bg-green-100'); // Light green for high trust
                trustScoreDisplay.classList.remove('text-blue-600', 'text-red-600', 'text-yellow-600');
                trustScoreDisplay.classList.add('text-green-600'); // Green text for score
            }
        });
    </script>

</body>
</html>
